databases:
  - name: smart-parking-db
    plan: free
    databaseName: smart_parking_db
    user: smart_parking_user

services:
  - type: web
    name: smart-parking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py seed_data && if [ -n "$DJANGO_ADMIN_RESET_PASSWORD" ]; then python manage.py reset_admin_password; fi && python manage.py collectstatic --noinput && gunicorn smart_parking.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/lots/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: smart-parking-api-fe0a.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: smart-parking-db
          property: connectionString
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://smart-parking-frontend-jxxa.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://smart-parking-frontend-jxxa.onrender.com,https://smart-parking-api-fe0a.onrender.com
      - key: FRONTEND_URL
        value: https://smart-parking-frontend-jxxa.onrender.com

  - type: web
    name: smart-parking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smart-parking-api-fe0a.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
